<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101214" />
    <meta name="description" content="Takt — a voice-driven, mobile-first interval timer." />
    <title>Takt — keep it going</title>

    <!-- Pre-paint appearance resolver: stamps data-theme on <html> before first paint, so a
         dark-mode user never sees a light frame. External (not inline) so it passes
         script-src 'self' on both the web and native CSPs. -->
    <script src="/theme-init.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Cloudflare Web Analytics — site-specific beacon for takt.hultberg.org. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "8198555bf9984ab3adcf11766c676eaf"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript-fallback">
        <h1 class="noscript-fallback-title">Takt needs JavaScript to run.</h1>
        <p class="noscript-fallback-text">
          Enable JavaScript in your browser and reload this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
