# Takt — Cloudflare Worker configuration.
# Single Worker serves the Vite-built SPA via Workers Assets and the /api/* routes.

name = "takt"
main = "worker/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Static SPA bundle (produced by `pnpm build` into ./dist).
# `run_worker_first = true` routes every request through the Worker so we can
# apply security headers uniformly. The Worker then delegates to the ASSETS
# binding. Bundle is tiny (~60 kB gz) so the CPU cost is negligible for Phase 1.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Observability (stream logs via `pnpm dlx wrangler tail`).
[observability]
enabled = true

# ──────────────────────────────────────────────────────────────────────────────
# Phase-added bindings (uncomment + fill in IDs when the resource is provisioned)
# ──────────────────────────────────────────────────────────────────────────────

# D1 database — users, presets, sessions. Activated in Phase 4.
[[d1_databases]]
binding = "DB"
database_name = "takt"
database_id = "f2fd3a7f-c5db-4f61-9d7c-d1add2f881ad"

# KV — session tokens. Activated in Phase 4.
[[kv_namespaces]]
binding = "SESSIONS"
id = "9174e638365545d6b73a9d0c922e315c"

# KV — anonymous and authenticated rate-limit counters. 3 calls per UTC day per
# hashed IP; user-tier key shape stubbed in (Phase 4 plugs in session→userId).
# Provision the namespace with: `pnpm dlx wrangler kv namespace create RATE_LIMITS`
# Then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "e4b953eb2e2c4aa5a3dda7daca86eb95"

# Workers AI — Whisper + Llama. Activated in Phase 3 for the voice pipeline.
[ai]
binding = "AI"

# Local-dev rate-limit bypass: create a gitignored `.dev.vars` file at the repo
# root containing `ALLOW_RATE_LIMIT_BYPASS=1` so iterative testing doesn't burn
# the 3/day cap. `.dev.vars` is loaded only by `wrangler dev`, never deployed —
# see https://developers.cloudflare.com/workers/configuration/secrets/#local-development-with-secrets.

# Daily retention purge — runs at 03:00 UTC every day.
[triggers]
crons = ["0 3 * * *"]

# Custom domain is configured in the Cloudflare dashboard under
# Workers & Pages → takt → Settings → Domains & Routes. No entry needed here.
